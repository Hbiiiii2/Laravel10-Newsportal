# docker-compose.yml

services:
    # Service Aplikasi Laravel (PHP-FPM)
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: laranews-app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        networks:
            - laranews-network

    # Service Database MySQL
    db:
        image: mysql:8.0
        container_name: laranews-db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-laranews_db}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
            MYSQL_PASSWORD: ${DB_PASSWORD:-password}
            MYSQL_USER: ${DB_USERNAME:-user}
        volumes:
            - db_data:/var/lib/mysql
        ports:
            - "3307:3306" # expose ke port 3307 di host untuk diakses via GUI client
        networks:
            - laranews-network

    # Service Web Server Nginx
    nginx:
        image: nginx:1.25-alpine
        container_name: laranews-nginx
        restart: unless-stopped
        ports:
            - "8080:80" # Akses aplikasi dari http://localhost:8080
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
            - db
        networks:
            - laranews-network

networks:
    laranews-network:
        driver: bridge

volumes:
    db_data:
        driver: local
